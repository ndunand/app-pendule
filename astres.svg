<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <style>.planet{display:none}.planet:target{display:inline}</style>
  <defs>
    <clipPath id="disk"><circle cx="80" cy="80" r="47"/></clipPath>
    <radialGradient id="shade" cx="28%" cy="24%" r="85%"><stop stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#06152f" stop-opacity=".5"/></radialGradient>
    <radialGradient id="glow"><stop stop-color="#d9f8ff"/><stop offset=".45" stop-color="#8f7bea" stop-opacity=".5"/><stop offset="1" stop-color="#8f7bea" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="earth" class="planet">
    <circle cx="80" cy="80" r="51" fill="#b4dcea" opacity=".5"/>
    <circle cx="80" cy="80" r="47" fill="#448ec1"/>
