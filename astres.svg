    <path d="M51 45q26-13 49-2M42 77q16-8 28-1M86 112q16-6 27-3" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="5" stroke-linecap="round"/>
    <circle cx="80" cy="80" r="47" fill="url(#shade)"/>
  </g>
  <g id="moon" class="planet"><circle cx="80" cy="80" r="47" fill="#b9bfca"/><g fill="#939caa"><circle cx="59" cy="61" r="12"/><circle cx="98" cy="91" r="15"/><circle cx="65" cy="108" r="7"/><circle cx="101" cy="55" r="6"/></g><g fill="#d6dbe2"><circle cx="56" cy="58" r="7"/><circle cx="94" cy="87" r="9"/></g><circle cx="80" cy="80" r="47" fill="url(#shade)"/></g>
  <g id="mercury" class="planet"><circle cx="80" cy="80" r="47" fill="#b3a393"/><g fill="#85776c" opacity=".6"><circle cx="61" cy="65" r="14"/><circle cx="99" cy="58" r="8"/><circle cx="91" cy="99" r="12"/><circle cx="56" cy="103" r="6"/></g><circle cx="80" cy="80" r="47" fill="url(#shade)"/></g>
  <g id="venus" class="planet"><circle cx="80" cy="80" r="47" fill="#dbb36f"/><g clip-path="url(#disk)" fill="none" stroke="#f5dba4" stroke-width="10"><path d="M24 58q35-18 60-3t54-3M23 80q29-19 56-2t58-2M26 106q30-15 54-4t58-1"/></g><circle cx="80" cy="80" r="47" fill="url(#shade)"/></g>
  <g id="mars" class="planet"><circle cx="80" cy="80" r="47" fill="#cb7051"/><g clip-path="url(#disk)"><path d="m45 64 26-6 13 15 27 4-9 17-24-8-17 11-18-12Z" fill="#9a4939"/><path d="m86 105 24-1 9 13-19 9Z" fill="#a64f3a"/><path d="M55 37q25-12 45 1l-13 8-20 1Z" fill="#f4e4d7"/></g><circle cx="80" cy="80" r="47" fill="url(#shade)"/></g>
  <g id="jupiter" class="planet"><circle cx="80" cy="80" r="47" fill="#ddbb99"/><g clip-path="url(#disk)" fill="none"><path d="M30 51h100M30 78h100M30 110h100" stroke="#ae775c" stroke-width="12"/><path d="M30 64h100M30 96h100" stroke="#f1ddbb" stroke-width="9"/><path d="M30 83q34-7 64 0t40-1" stroke="#ca9570" stroke-width="4"/></g><ellipse cx="99" cy="95" rx="13" ry="8" fill="#b8664b"/><ellipse cx="97" cy="93" rx="8" ry="4" fill="#d68f67"/><circle cx="80" cy="80" r="47" fill="url(#shade)"/></g>
  <g id="saturn" class="planet"><ellipse cx="80" cy="80" rx="71" ry="20" transform="rotate(-22 80 80)" fill="none" stroke="#b4a07e" stroke-width="12"/><circle cx="80" cy="80" r="40" fill="#d9c38d"/><g clip-path="url(#disk)" stroke="#b5a06f" stroke-width="7" opacity=".6"><path d="M43 66h74M42 85h76M49 103h62"/></g><circle cx="80" cy="80" r="40" fill="url(#shade)"/><path d="M14 106q30 9 77-9t55-43" fill="none" stroke="#d5c7a6" stroke-width="9"/><path d="M14 106q30 9 77-9t55-43" fill="none" stroke="#a69374" stroke-width="2"/></g>
  <g id="uranus" class="planet"><circle cx="80" cy="80" r="47" fill="#87cbd5"/><g clip-path="url(#disk)" stroke="#b9e8e7" stroke-width="12" opacity=".45"><path d="M30 58h100M30 89h100"/></g><circle cx="80" cy="80" r="47" fill="url(#shade)"/><ellipse cx="80" cy="80" rx="61" ry="17" transform="rotate(-65 80 80)" fill="none" stroke="#83aeb8" stroke-width="2"/></g>
  <g id="neptune" class="planet"><circle cx="80" cy="80" r="47" fill="#426ed2"/><g clip-path="url(#disk)" fill="none" stroke="#85abed" stroke-width="5" opacity=".6"><path d="M32 63q40-13 96-2M34 99q40-13 94-3"/></g><ellipse cx="98" cy="85" rx="13" ry="7" fill="#2b4d9d"/><path d="m94 97 19-2" stroke="#b2d2ff" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="80" r="47" fill="url(#shade)"/></g>
  <g id="sun" class="planet"><g stroke="#e5a63d" stroke-width="5" stroke-linecap="round"><path d="M80 12v10M80 138v10M12 80h10M138 80h10M32 32l8 8M120 120l8 8M32 128l8-8M120 40l8-8"/></g><circle cx="80" cy="80" r="55" fill="#fbe09b" opacity=".5"/><circle cx="80" cy="80" r="47" fill="#f5b63d"/><g fill="#ffe19a"><circle cx="62" cy="61" r="14"/><circle cx="103" cy="73" r="8"/><circle cx="79" cy="104" r="10"/></g><path d="m46 86 12-5M94 47l11 8M103 108l10-5" stroke="#e98f2b" stroke-width="6" stroke-linecap="round"/></g>
  <g id="neutron" class="planet"><circle cx="80" cy="80" r="73" fill="url(#glow)"/><path d="m73 66-9-58 22 52M87 94l9 58-22-52" fill="#9b81e0" opacity=".65"/><path d="M71 10 89 150" stroke="#d7edff" stroke-width="3"/><ellipse cx="80" cy="80" rx="55" ry="20" transform="rotate(-25 80 80)" fill="none" stroke="#a792da" stroke-width="3"/><circle cx="80" cy="80" r="25" fill="#d6f2ff"/><circle cx="74" cy="73" r="13" fill="#fff"/><circle cx="80" cy="80" r="25" fill="url(#shade)"/></g>
